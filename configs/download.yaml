    landing: https://rdm.uq.edu.au/files/4ac221b1-6bd6-42b1-bdf7-03f4fc7efb22
    rdm_uuid: 4ac221b1-6bd6-42b1-bdf7-03f4fc7efb22
    uq_name: NF-CICIDS2018-v3
