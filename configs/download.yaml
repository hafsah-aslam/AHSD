# Official UQ download locations for the NetFlow v3 datasets.
#
# Verified 2026-10-04 against the v3 section of
# https://staff.itee.uq.edu.au/marius/NIDS_datasets/ : each dataset heading on that
# page links ("Please click here") to the UQ Research Data Manager (RDM) landing URL
# below. The RDM API (https://api.rdm.uq.edu.au/datasets/<uuid>/file-details)
# reports each record as PUBLISHED, accessType OPEN, licence "Permitted Re-Use with
# Commercial Use Restriction", owner Majed Luay (first author of arXiv:2503.04404).
# `.../<uuid>/download` returns a one-hour signed S3 URL, so the landing URL is
# the stable reference. Note: UQ calls D1 "NF-CICIDS2018-v3"; it is saved under
# the spec name. No mirror is ever used.
urls:
